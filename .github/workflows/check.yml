name: Check NZ visa status
 
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_visa.py
 
      - name: Save state
        run: |
          git config user.name "visa-bot"
          git config user.email "visa-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -q && git push) || true
 
